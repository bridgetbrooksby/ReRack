<meta charset="utf-8">
<title>ReRack</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a phone-width app column. Sticky header with membership + credit, bottom tab bar,
   every price is a hang tag. Denim blue for actions, marigold "thread" for store credit. */
:root {
  --bg: #F2F4F8; --surface: #FFFFFF; --ink: #141B2D; --muted: #5A6377; --line: #D7DDE8; --soft: #E7ECF5;
  --denim: #2B4C8C; --denim-ink: #FFFFFF; --thread: #E2A321; --thread-soft: #FBF0D9; --thread-ink: #2A1E05;
  --ok: #1E7A4C; --ok-soft: #DDF1E6; --warn: #96600A; --warn-soft: #FAEED6; --bad: #A93535; --bad-soft: #F7E0E0;
  --sw1: #DCE5F5; --sw2: #F5E3C8; --sw3: #D6ECE1; --sw4: #F2D9DD; --sw5: #E4DDF2; --sw6: #E6EAEF; --swink: #2B3A5A;
  --f-display: "Unbounded", "Trebuchet MS", system-ui, sans-serif;
  --f-body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1320; --surface: #172032; --ink: #E7EBF3; --muted: #9AA3B7; --line: #2A3449; --soft: #1E2840;
  --denim: #86A6E8; --denim-ink: #0E1320; --thread: #F0B649; --thread-soft: #3A2E15; --thread-ink: #1E1503;
  --ok: #63C893; --ok-soft: #173327; --warn: #E6AE45; --warn-soft: #362A12; --bad: #EF8080; --bad-soft: #3A1C1F;
  --sw1: #22304D; --sw2: #3A3020; --sw3: #1D382C; --sw4: #3B2328; --sw5: #2D2644; --sw6: #252C39; --swink: #C8D3EA;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E1320; --surface: #172032; --ink: #E7EBF3; --muted: #9AA3B7; --line: #2A3449; --soft: #1E2840;
  --denim: #86A6E8; --denim-ink: #0E1320; --thread: #F0B649; --thread-soft: #3A2E15; --thread-ink: #1E1503;
  --ok: #63C893; --ok-soft: #173327; --warn: #E6AE45; --warn-soft: #362A12; --bad: #EF8080; --bad-soft: #3A1C1F;
  --sw1: #22304D; --sw2: #3A3020; --sw3: #1D382C; --sw4: #3B2328; --sw5: #2D2644; --sw6: #252C39; --swink: #C8D3EA;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: var(--denim); }
:focus-visible { outline: 2px solid var(--denim); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 0 96px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.display { font-family: var(--f-display); font-weight: 700; letter-spacing: -.01em; }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: -.02em; margin-right: auto; }
.brand span { color: var(--denim); }
.chip-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.credit-pill { background: var(--thread); color: var(--thread-ink); border-color: transparent; font-family: var(--f-mono); font-weight: 500; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.dot.off { background: var(--muted); }

/* Bottom nav */
.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.nav-inner { max-width: 560px; margin: 0 auto; display: flex; }
.nav button { flex: 1; min-width: 0; background: none; border: 0; padding: 8px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; color: var(--muted); cursor: pointer; position: relative; }
.nav button[aria-current="page"] { color: var(--denim); font-weight: 700; }
.nav svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.badge { position: absolute; top: 4px; left: calc(50% + 6px); background: var(--thread); color: var(--thread-ink); border-radius: 999px; font-size: 10px; min-width: 16px; padding: 0 4px; font-weight: 700; }

/* Surfaces */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.notice { border-radius: var(--r); padding: 12px 14px; font-size: 14px; background: var(--soft); }
.notice.warn { background: var(--warn-soft); color: var(--ink); }
.notice.bad { background: var(--bad-soft); }
.notice.ok { background: var(--ok-soft); }
.notice.thread { background: var(--thread-soft); }
.section-title { font-family: var(--f-display); font-size: 16px; font-weight: 500; }
hr.stitch { border: 0; border-top: 1.5px dashed var(--line); margin: 4px 0; width: 100%; }

/* Buttons & fields */
.btn { border: 0; border-radius: 8px; padding: 11px 16px; font-weight: 700; cursor: pointer; background: var(--denim); color: var(--denim-ink); text-align: center; }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; color: var(--denim); border: 1.5px solid var(--denim); }
.btn.quiet { background: var(--soft); color: var(--ink); }
.btn.danger { background: transparent; color: var(--bad); border: 1.5px solid var(--bad); }
.btn.small { padding: 7px 12px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; font-weight: 500; }
.field input, .field select, .field textarea { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; width: 100%; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.grid3 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 > :first-child { grid-column: 1 / -1; } }
.err { color: var(--bad); font-size: 13px; }

/* Chips */
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chips button { flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
.chips button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.pill { display: inline-block; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 500; background: var(--soft); white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.hot { background: var(--thread-soft); color: var(--warn); }

/* Hang-tag price */
.tag { position: relative; display: inline-flex; align-items: center; background: var(--thread); color: var(--thread-ink); font-family: var(--f-mono); font-weight: 500; font-size: 14px; padding: 3px 10px 3px 18px; clip-path: polygon(9px 0, 100% 0, 100% 100%, 9px 100%, 0 50%); border-radius: 0 4px 4px 0; font-variant-numeric: tabular-nums; }
.tag::before { content: ""; position: absolute; left: 7px; top: 50%; width: 5px; height: 5px; margin-top: -2.5px; border-radius: 50%; background: var(--surface); }
.tag.big { font-size: 20px; padding: 6px 14px 6px 24px; clip-path: polygon(12px 0, 100% 0, 100% 100%, 12px 100%, 0 50%); }
.tag.big::before { left: 9px; width: 7px; height: 7px; margin-top: -3.5px; }

/* Product grid */
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; text-align: left; padding: 0; cursor: pointer; display: flex; flex-direction: column; }
.card:hover { border-color: var(--denim); }
.card-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.card-title { font-weight: 700; font-size: 14px; line-height: 1.25; }
.tile { aspect-ratio: 4 / 5; max-width: 100%; display: grid; place-items: center; position: relative; overflow: hidden; }
.tile svg { width: 46%; height: auto; fill: var(--swink); opacity: .8; }
.tile img { width: 100%; height: 100%; object-fit: cover; }
.tile .sold { position: absolute; inset: auto 8px 8px auto; }
.sw1 { background: var(--sw1); } .sw2 { background: var(--sw2); } .sw3 { background: var(--sw3); }
.sw4 { background: var(--sw4); } .sw5 { background: var(--sw5); } .sw6 { background: var(--sw6); }
.in-bag { position: absolute; top: 8px; left: 8px; }

/* Lists */
.list { display: flex; flex-direction: column; }
.li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li .grow { flex: 1; min-width: 0; }
.thumb { width: 52px; height: 64px; flex: none; border-radius: 6px; overflow: hidden; }
.thumb .tile { aspect-ratio: auto; width: 100%; height: 100%; }
.thumb .tile svg { width: 60%; }
.sum { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-variant-numeric: tabular-nums; }
.sum .total { font-weight: 700; font-size: 17px; }
.sum dt, .sum dd { margin: 0; }
.sum dd { text-align: right; font-family: var(--f-mono); }

/* Steps */
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; counter-reset: s; }
.steps li { counter-increment: s; font-size: 12px; line-height: 1.3; display: flex; flex-direction: column; gap: 4px; }
.steps li::before { content: counter(s); font-family: var(--f-mono); width: 24px; height: 24px; border-radius: 50%; border: 1.5px dashed var(--denim); color: var(--denim); display: grid; place-items: center; font-size: 12px; }

/* Photos */
.photos { display: flex; gap: 8px; flex-wrap: wrap; }
.photos img, .photo-add { width: 72px; height: 88px; object-fit: cover; border-radius: 6px; }
.photo-add { border: 1.5px dashed var(--denim); display: grid; place-items: center; color: var(--denim); font-size: 12px; text-align: center; cursor: pointer; padding: 4px; position: relative; }
.photo-add input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.ph-wrap { position: relative; }
.ph-wrap button { position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 50%; border: 0; background: var(--ink); color: var(--bg); font-size: 13px; line-height: 1; cursor: pointer; }

/* Ticket-ish blocks for labels and codes */
.ticket { border: 1.5px dashed var(--ink); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.code { font-family: var(--f-mono); font-size: 22px; letter-spacing: .14em; }

/* Sheet */
.scrim { position: fixed; inset: 0; z-index: 10; background: rgb(8 12 22 / .5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; max-height: 90%; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom, 0px)); }
.sheet .tile { border-radius: var(--r); aspect-ratio: 4 / 3; }
.close { float: right; border: 0; background: var(--soft); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-size: 16px; }

/* Onboarding */
.hero { padding-block: 28px 8px; display: flex; flex-direction: column; gap: 14px; }
.hero h1 { font-family: var(--f-display); font-size: clamp(30px, 8vw, 44px); line-height: 1.02; letter-spacing: -.03em; }
.hero h1 em { font-style: normal; color: var(--denim); }
.plan { border: 2px solid var(--denim); border-radius: var(--r); padding: 14px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }

.credit-hero { background: var(--thread); color: var(--thread-ink); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 4px; }
.credit-hero .num { font-family: var(--f-mono); font-size: 40px; line-height: 1.1; }

.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; z-index: 20; font-size: 14px; max-width: calc(100% - 32px); }
.switch { display: flex; align-items: center; gap: 10px; cursor: pointer; }
.switch input { width: 18px; height: 18px; accent-color: var(--denim); }
.strike { color: var(--muted); font-family: var(--f-mono); font-size: 12px; }
.filters { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.tbl th { text-align: left; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 0 6px 6px 0; }
.tbl td { padding: 8px 6px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
.tbl .num { text-align: right; white-space: nowrap; }
</style>

<div id="app"></div>
<div id="sheet"></div>
<div id="toast" class="toast" hidden></div>

<script>
/* ------------------------------------------------------------------
   ReRack — clothing swap prototype. A clickable stand-in for the Glide
   app described in SPEC.md. Everything lives in this file and in the
   browser's local storage; there is no server.
   Business rules are all in the CONFIG block so they're easy to tune.
------------------------------------------------------------------- */

// ===== CONFIG =====
const MEMBERSHIP_PRICE = 6.99;
const CREDIT_RATE = 0.60;     // credit = 60% of the item's list price, set once at grading
const AGED_DAYS = 30;         // items listed this many days or more...
const AGED_DISCOUNT = 0.30;   // ...are this much cheaper for members
const SCHOOL_DOMAIN = /@([a-z0-9-]+\.)*byu\.edu$/i;  // sign-up is limited to BYU emails
// PLACEHOLDER: which brands go in each tier, and each tier's price, are still open in the spec.
const DEFAULT_TIERS = [
  { id: 't1', name: 'Tier 1', listPrice: 40, brands: ['Lululemon', 'Reformation', 'Free People', 'Madewell', 'Aritzia', 'Patagonia'] },
  { id: 't2', name: 'Tier 2', listPrice: 25, brands: ['Levi\'s', 'Abercrombie', 'Nike', 'J.Crew', 'Aerie', 'Urban Outfitters'] },
  { id: 't3', name: 'Tier 3', listPrice: 15, brands: ['American Eagle', 'Brandy Melville', 'Zara', 'H&M', 'Gap', 'Hollister'] },
];
// PLACEHOLDER: the category list is still open in the spec.
const CATS = {
  tops: { label: 'Tops', art: 'top' }, sweaters: { label: 'Sweaters', art: 'top' }, activewear: { label: 'Activewear', art: 'top' },
  dresses: { label: 'Dresses', art: 'dress' }, skirts: { label: 'Skirts', art: 'dress' },
  jeans: { label: 'Jeans', art: 'bottom' }, pants: { label: 'Pants', art: 'bottom' }, shorts: { label: 'Shorts', art: 'bottom' },
  outerwear: { label: 'Outerwear', art: 'outer' },
};
const SIZES = ['XXS', 'XS', 'S', 'M', 'L', 'XL', 'XXL', '00', '0', '2', '4', '6', '8', '10', '12', '14', '24', '25', '26', '27', '28', '29', '30', '31', '32'];
// PLACEHOLDER: campus locations and times, and BYU's permission, are still open in the spec.
const SLOT_PLAN = {
  dropoff: { location: 'Campus drop-off (location TBD)', hour: 12, hours: 2 },
  pickup: { location: 'Campus pickup (location TBD)', hour: 16, hours: 2 },
};
const REJECT_REASONS = ['Brand isn\'t on our list', 'Too much wear or damage', 'Not women\'s clothing', 'Doesn\'t match the photo'];

// ===== HELPERS =====
const KEY = 'rerack-v2';
const DAY = 864e5;
const round2 = n => Math.round(n * 100) / 100;
const money = n => '$' + round2(n).toFixed(2);
const uid = p => p + '-' + Math.random().toString(36).slice(2, 7).toUpperCase();
const nowIso = () => new Date().toISOString();
const daysAgo = d => new Date(Date.now() - d * DAY).toISOString();
const daysAhead = d => new Date(Date.now() + d * DAY).toISOString();
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
const fmtTime = iso => new Date(iso).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const optList = (pairs, sel) => pairs.map(([k, v]) => `<option value="${esc(k)}"${k === sel ? ' selected' : ''}>${esc(v)}</option>`).join('');
const catPairs = () => Object.entries(CATS).map(([k, v]) => [k, v.label]);
const sizePairs = () => SIZES.map(s => [s, s]);
const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
const swatch = id => 'sw' + (1 + [...String(id)].reduce((a, c) => a + c.charCodeAt(0), 0) % 6);

// ----- Business rules (SPEC §7) -----
const tierById = (id, list = S.tiers) => list.find(t => t.id === id) || null;
const tierForBrand = brand => { const b = brand.trim().toLowerCase(); return b ? S.tiers.find(t => t.brands.some(x => x.toLowerCase() === b)) || null : null; };
const creditFor = tier => round2(tier.listPrice * CREDIT_RATE);
const listPrice = i => tierById(i.tier).listPrice;
const daysListed = i => Math.floor((Date.now() - new Date(i.listedAt)) / DAY);
const isAged = i => daysListed(i) >= AGED_DAYS;
const memberPrice = i => isAged(i) ? round2(listPrice(i) * (1 - AGED_DISCOUNT)) : listPrice(i);
const priceFor = i => isMember() ? memberPrice(i) : listPrice(i);
const balance = () => round2(S.ledger.reduce((a, e) => a + e.amt, 0));
const itemName = i => i.title || `${i.brand} ${CATS[i.cat].label.toLowerCase()}`;
const membership = () => S.user.membership.status;  // 'none' | 'active' | 'lapsed'
const isMember = () => !!S.user && membership() === 'active';

// ----- Slots -----
function makeSlots(type, count) {
  const plan = SLOT_PLAN[type], out = [];
  for (let d = 1; out.length < count; d++) {
    const start = new Date(); start.setDate(start.getDate() + d); start.setHours(plan.hour, 0, 0, 0);
    if (start.getDay() === 0) continue;  // no Sunday slots
    out.push({ id: uid('SL'), type, location: plan.location, start: start.toISOString(), end: new Date(start.getTime() + plan.hours * 36e5).toISOString() });
  }
  return out;
}
const slotById = id => S.slots.find(s => s.id === id);
const futureSlots = type => S.slots.filter(s => s.type === type && new Date(s.end) > new Date()).sort((a, b) => a.start.localeCompare(b.start));
const fmtSlot = s => s ? `${new Date(s.start).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' })}, ${fmtTime(s.start)}–${fmtTime(s.end)} · ${s.location}` : 'Slot removed';
// Keep the prototype usable when it's reopened weeks later: if every slot of a type is past, open new default ones.
function topUpSlots() { ['dropoff', 'pickup'].forEach(t => { if (!futureSlots(t).length) S.slots.push(...makeSlots(t, 5)); }); }

const ART = {
  top: '<path d="M10 4 L13 3 Q16 6 19 3 L22 4 L29 10 L25 15 L22 12 L22 29 L10 29 L10 12 L7 15 L3 10 Z"/>',
  bottom: '<path d="M8 3 H24 L26 29 H18.5 L16 11 L13.5 29 H6 Z"/>',
  dress: '<path d="M12 3 H14 Q16 6 18 3 H20 L19 10 L26 29 H6 L13 10 Z"/>',
  outer: '<path d="M11 3 L16 9 L21 3 L28 7 L27 29 H17 V10 H15 V29 H5 L4 7 Z"/>',
};
const ICON = {
  shop: '<path d="M12 8a2.2 2.2 0 1 0-2.2-2.2M12 8v1.5L3 16.5h18L12 9.5"/>',
  orders: '<path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/>',
  dropoff: '<path d="M3 7.5 12 3.5l9 4v9l-9 4-9-4zM3 7.5l9 4 9-4M12 11.5v9"/>',
  credit: '<path d="M3 7h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H3zM3 7l12-3v3M16 13h2"/>',
  account: '<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0"/>',
  admin: '<path d="M3 21V9l9-5 9 5v12M7 21v-7h10v7M7 17.5h10"/>',
};
function tile(item, extra = '') {
  return `<div class="tile ${swatch(item.id)}">${item.photo ? `<img src="${item.photo}" alt="">` : `<svg viewBox="0 0 32 32" aria-hidden="true">${ART[CATS[item.cat].art]}</svg>`}${extra}</div>`;
}

// ===== STATE =====
function load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); return true; }

function cardFields(p) {

    <div class="grid2">

function readCard(p) {
  const num = document.getElementById(p + 'Card').value.replace(/\D/g, '');
  const exp = document.getElementById(p + 'Exp').value.trim();
  const cvc = document.getElementById(p + 'Cvc').value.replace(/\D/g, '');
  if (num.length < 13 || num.length > 19) return { err: 'Enter the full card number.' };
  const m = exp.match(/^(\d{2})\s*\/\s*(\d{2})$/);
  if (!m || +m[1] < 1 || +m[1] > 12) return { err: 'Enter the expiration as MM/YY.' };
  if (new Date(2000 + +m[2], +m[1], 0) < new Date()) return { err: 'That card has expired.' };
  if (cvc.length < 3) return { err: 'Enter the 3 or 4 digit CVC.' };
  return { last4: num.slice(-4) };
}

function maxCreditFor(i) { return isMember() ? round2(Math.min(balance(), priceFor(i))) : 0; }
function coSummary(price, credit) {

  return `<dl class="sum">

}
function checkoutSheet() {

  if (!i || i.status !== 'listed') return `<button class="close" data-act="closeSheet" aria-label="Close">✕</button><div class="notice">This item just sold.</div>`;
  const price = priceFor(i), max = maxCreditFor(i), slots = futureSlots('pickup');
  return `<button class="close" data-act="closeSheet" aria-label="Close">✕</button>
    <form id="checkoutForm" class="stack" data-id="${i.id}" novalidate>

      ${isMember()
        ? `<div class="field"><label for="coCredit">Store credit to use (${money(balance())} available)</label><input id="coCredit" type="number" inputmode="decimal" min="0" max="${max}" step="0.01" value="${max.toFixed(2)}"${max <= 0 ? ' disabled' : ''}></div>
           <p class="small muted">Credit goes first. Lower it if you'd rather put more on your card.</p>`
        : `<p class="small muted">Non-members pay by card. ${membership() === 'lapsed' ? 'Renew your membership to spend your store credit.' : 'Members can pay with store credit.'}</p>`}
      <div id="coSummary">${coSummary(price, max)}</div>
      ${S.user.card ? `<p class="small">Any card amount goes on card ••${esc(S.user.card.last4)}.</p>` : `<div class="stack">${cardFields('co')}<p class="small muted">Not needed if credit covers the whole price.</p></div>`}
      <div class="field"><label for="coSlot">Campus pickup slot</label>${slots.length ? `<select id="coSlot">${slots.map(s => `<option value="${s.id}">${esc(fmtSlot(s))}</option>`).join('')}</select>` : '<p class="err">No pickup slots are open right now.</p>'}</div>
      <p id="coErr" class="err" hidden></p>
      <button class="btn block" type="submit"${slots.length ? '' : ' disabled'}>Place order</button>
    </form>`;
}
function readCredit(i) {
  const el = document.getElementById('coCredit');
  if (!el || el.disabled) return { credit: 0 };
  const raw = el.value.trim(), v = raw === '' ? 0 : Number(raw), max = maxCreditFor(i);
  if (!Number.isFinite(v) || v < 0) return { err: 'Enter a credit amount of $0 or more.' };
  if (round2(v) > max) return { err: `You can use up to ${money(max)} of credit on this item.` };
  return { credit: round2(v) };
}
function placeOrder(form) {
  const i = S.items.find(x => x.id === form.dataset.id);
  if (!i || i.status !== 'listed') return showErr('coErr', 'This item just sold.');
  const price = priceFor(i), r = readCredit(i);
  if (r.err) return showErr('coErr', r.err);
  const cash = round2(price - r.credit);
  let card = S.user.card;
  if (cash > 0 && !card) { const c = readCard('co'); if (c.err) return showErr('coErr', c.err); card = { last4: c.last4 }; S.user.card = card; }
  const slot = document.getElementById('coSlot');
  if (!slot || !slot.value) return showErr('coErr', 'Pick a pickup slot.');
  const o = { id: uid('OR'), date: nowIso(), itemId: i.id, price, creditUsed: r.credit, cash, cardLast4: cash > 0 ? card.last4 : null, slotId: slot.value, status: 'paid', pickedUpAt: null };
  i.status = 'sold';
  if (o.creditUsed > 0) S.ledger.push({ id: uid('CR'), date: o.date, amt: -o.creditUsed, type: 'spent', itemId: i.id, orderId: o.id, note: `Order ${o.id} · ${itemName(i)}` });
  S.orders.push(o); save();
  sheet = { type: 'order', id: o.id }; S.ui.tab = 'orders'; render();
}
function orderSheet() {
  const o = S.orders.find(x => x.id === sheet.id), i = S.items.find(x => x.id === o.itemId);
  return `<button class="close" data-act="closeSheet" aria-label="Close">✕</button>
    <div class="stack">
      <p class="eyebrow">Order ${o.id}</p>
      <h2 class="display" style="font-size:22px">${o.status === 'paid' ? 'Paid. Pick it up on campus.' : 'Picked up.'}</h2>

}

function saveTiers() {
  const next = [];
  for (const t of S.tiers) {
    const name = document.getElementById('tn-' + t.id).value.trim();
    const price = Number(document.getElementById('tp-' + t.id).value);
    const brands = document.getElementById('tb-' + t.id).value.split(',').map(b => b.trim()).filter(Boolean);
    if (!name) return showErr('tsErr', 'Every tier needs a name.');
    if (!Number.isFinite(price) || price <= 0) return showErr('tsErr', `Enter a list price above $0 for ${name}.`);
    next.push({ id: t.id, name, listPrice: round2(price), brands });
  }
  S.tiers = next; save(); render(); toast('Tiers saved.');

function addSlot() {
  const v = id => document.getElementById(id).value.trim();
  if (!v('slDate')) return showErr('slErr', 'Pick a date.');

}

function finishDropIfGraded(dropOffId) {

// ===== ACTIONS =====
const ACT = {
  showSignup() { S.ui.signup = true; render(); },
  hideSignup() { S.ui.signup = false; render(); },
  demo() { S = demoState(); save(); render(); toast('Signed in to the demo account.'); },
  tab(d) { S.ui.tab = d.tab; confirming = null; save(); render(); window.scrollTo(0, 0); },
  adminTab(d) { S.ui.adminTab = d.at; save(); render(); },
  openItem(d) { sheet = { type: 'item', id: d.id }; renderSheet(); },
  buy(d) { sheet = { type: 'checkout', id: d.id }; renderSheet(); },
  openOrder(d) { sheet = { type: 'order', id: d.id }; renderSheet(); },
  closeSheet() { sheet = null; renderSheet(); },
  removePhoto() { pendingPhoto = null; document.getElementById('photoPreview').innerHTML = photoPreview(); },
  removeDraft(d) { draftBag.splice(+d.idx, 1); render(); },
  submitDrop() {
    const slot = document.getElementById('doSlot');
    if (!draftBag.length || !slot) return;
    const d = { id: 'DO-' + (2000 + Math.floor(Math.random() * 8000)), slotId: slot.value, submittedAt: nowIso(), status: 'submitted' };
    S.dropOffs.push(d);
    draftBag.forEach(it => S.items.push(myItem(d.id, it.brand, it.cat, it.size, it.title, it.estTier, { id: it.id, photo: it.photo })));
    draftBag = []; save(); render(); toast('Submitted. Bring your bag to your drop-off slot.');
  },
  accept(d) {
    const i = S.items.find(x => x.id === d.id), t = tierById(document.getElementById('gt-' + i.id).value);
    if (!t) return showErr('ge-' + i.id, 'Choose a tier to accept this piece.');
    const now = nowIso();
    Object.assign(i, { status: 'listed', tier: t.id, creditAwarded: creditFor(t), listedAt: now, gradedAt: now });
    S.ledger.push({ id: uid('CR'), date: now, amt: i.creditAwarded, type: 'earned', itemId: i.id, note: `Accepted: ${itemName(i)}` });
    finishDropIfGraded(i.dropOffId); save(); render(); toast(`Accepted. ${money(i.creditAwarded)} credit added.`);
  },
  reject(d) {
    const i = S.items.find(x => x.id === d.id);
    Object.assign(i, { status: 'rejected', rejectReason: document.getElementById('gr-' + i.id).value || null, gradedAt: nowIso() });
    finishDropIfGraded(i.dropOffId); save(); render(); toast('Rejected. It goes in the donate pile.');
  },
  markPickedUp(d) {
    const o = S.orders.find(x => x.id === d.id);
    o.status = 'pickedup'; o.pickedUpAt = nowIso();
    S.items.find(x => x.id === o.itemId).status = 'pickedup';
    save(); render(); toast(`${o.id} picked up.`);
  },
  backdate(d) { const i = S.items.find(x => x.id === d.id); i.listedAt = new Date(new Date(i.listedAt) - AGED_DAYS * DAY).toISOString(); save(); render(); },
  removeSlot(d) {
    const inUse = S.orders.some(o => o.status === 'paid' && o.slotId === d.id) || S.dropOffs.some(x => x.status === 'submitted' && x.slotId === d.id);
    if (inUse) return toast('Someone is booked into that slot, so it can\'t be removed.');
    S.slots = S.slots.filter(s => s.id !== d.id); save(); render();
  },
  confirm(d) { confirming = d.key; render(); },
  unconfirm() { confirming = null; render(); },
  cancelMembership() { S.user.membership.status = 'lapsed'; confirming = null; save(); render(); toast('Membership cancelled. Your credit is kept.'); },
  reset() { try { localStorage.removeItem(KEY); } catch (e) {} S = freshState(); confirming = null; sheet = null; draftBag = []; pendingPhoto = null; render(); },
};

document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]');
  if (!a || !ACT[a.dataset.act]) return;
  // The scrim only closes the sheet when the click lands on the scrim itself.
  if (a.classList.contains('scrim') && e.target !== a) return;
  ACT[a.dataset.act](a.dataset, e);
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && sheet) { sheet = null; renderSheet(); } });

document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') { S.ui.q = t.value; document.getElementById('grid').innerHTML = gridHTML(); }
  if (t.id === 'tiBrand') document.getElementById('estimate').innerHTML = estimateHTML(t.value);
  if (t.id === 'coCredit') {
    const i = S.items.find(x => x.id === sheet.id), r = readCredit(i);
    document.getElementById('coSummary').innerHTML = coSummary(priceFor(i), r.err ? 0 : r.credit);
  }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.dataset.filter) { S.ui[t.dataset.filter] = t.value; save(); document.getElementById('grid').innerHTML = gridHTML(); }
  if (t.id === 'doSlot') { S.ui.doSlot = t.value; save(); }
  if (t.id === 'adminToggle') { S.admin = t.checked; if (!S.admin && S.ui.tab === 'admin') S.ui.tab = 'account'; save(); render(); if (S.admin) toast('Admin tab added to the menu.'); }
  if (t.id === 'tiPhoto' && t.files.length) {
    try { pendingPhoto = await shrink(t.files[0]); } catch (err) { toast('That file isn\'t an image we can read.'); }
    document.getElementById('photoPreview').innerHTML = photoPreview();
  }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const handlers = { signupForm: signup, memberForm: startMembership, itemForm: addItem, checkoutForm: () => placeOrder(e.target), tiersForm: saveTiers, slotForm: addSlot };
  if (handlers[e.target.id]) handlers[e.target.id]();
});

function signup() {
  const name = document.getElementById('suName').value.trim(), email = document.getElementById('suEmail').value.trim();
  if (!name || !email) return showErr('suErr', 'Add your name and BYU email.');
  if (!/^\S+@\S+\.\S+$/.test(email)) return showErr('suErr', 'Enter a valid email address.');
  if (!SCHOOL_DOMAIN.test(email)) return showErr('suErr', 'ReRack is only open to BYU students right now. Sign up with your byu.edu email.');
  S.user = { name, email, card: null, membership: { status: 'none', since: null, renews: null } };
  S.ui.signup = false; S.ui.tab = 'shop';
  save(); render(); toast('Account created. Become a member any time to drop off clothes.');
}
// Downscale photos so a bag of drop-offs fits in browser storage.
function shrink(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 480 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.72));
      };
      img.onerror = reject; img.src = r.result;
    };
    r.onerror = reject; r.readAsDataURL(file);
  });
}

render();
</script>
